name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        contract:
          - contracts/spend-limit
          - contracts/rate-limit
          - contracts/multisig-policy
          - contracts/time-lock

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run unit tests — ${{ matrix.contract }}
        run: cargo test --manifest-path ${{ matrix.contract }}/Cargo.toml

      - name: Build WASM — ${{ matrix.contract }}
        run: cargo build --manifest-path ${{ matrix.contract }}/Cargo.toml --target wasm32-unknown-unknown --release

  event-pipeline:
    name: Event Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-relay-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests — webhook-relay
        run: cargo test -p forge-webhook-relay

      - name: Build — webhook-relay
        run: cargo build -p forge-webhook-relay --release

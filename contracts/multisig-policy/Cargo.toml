[package]
name = "forge-multisig-policy"
version = "0.1.0"
edition = "2021"
authors = ["Abdulmalik Ojo <abdulmalikojo2@gmail.com>"]
description = "Soroban N-of-M multisig policy contract — operations only execute when the required number of authorised signers have approved."
license = "MIT"
repository = "https://github.com/AstroForgeLabs/soroban-forge"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package]
name = "forge-rate-limit"
version = "0.1.0"
edition = "2021"
authors = ["Abdulmalik Ojo <abdulmalikojo2@gmail.com>"]
description = "Soroban policy contract enforcing call-rate limits within configurable sliding time windows."
license = "MIT"
repository = "https://github.com/AstroForgeLabs/soroban-forge"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

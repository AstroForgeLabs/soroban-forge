[package]
name = "forge-spend-limit"
version = "0.1.0"
edition = "2021"
authors = ["Abdulmalik Ojo <abdulmalikojo2@gmail.com>"]
description = "Soroban policy contract enforcing per-transaction and cumulative spend limits for Stellar custom accounts."
license = "MIT"
repository = "https://github.com/AstroForgeLabs/soroban-forge"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "21.7.6" }

[dev-dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

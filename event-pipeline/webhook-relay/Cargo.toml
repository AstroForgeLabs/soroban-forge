[package]
name = "forge-webhook-relay"
version = "0.1.0"
edition = "2021"
authors = ["Abdulmalik Ojo <abdulmalikojo2@gmail.com>"]
description = "Off-chain Stellar Horizon SSE event listener that fans out contract events to HTTP webhooks with HMAC-SHA256 signing."
license = "MIT"
repository = "https://github.com/AstroForgeLabs/soroban-forge"

[[bin]]
name = "forge-webhook-relay"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
